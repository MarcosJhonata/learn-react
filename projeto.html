<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de clientes</title>
</head>
<body>
    <div id="root" class=""></div>

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
         
         const textVariants = {
            default: 'text-xl text-black',
            red: 'text-xl text-red-500'
         }

         function Text({
            as= 'span',
            variant = 'default',
            className,
            children,
            ...props
         }) {
            return React.createElement(
                as, 
                {
                    className: `${textVariants[variant]} ${className ? className : ''}`,
                    ...props,
                },
                children
            )
         }

         const buttonVariants = {
            default: 'bg-blue-500',
            primary: 'bg-blue-300'
         }

         function Button({
            variant = 'default',
            className,
            children,
            ...props
         }) {
            return (
                <Text
                as="button"
                variant="default"
                className={`
                    flex items-center justify-center rounded
                    p-3 cursor-pointer
                    ${buttonVariants[variant]}
                    ${className ? className : ''}
                    `}
                    {...props}
                >
                    {children}
                </Text>
            )
         }

         function Input({children, placeholder,  ...props}) {
            return (
                <div>
                    <input 
                    className="bg-gray-400" 
                    type="text"
                    placeholder={placeholder}
                    {...props}
                    /> 
                   
                </div>
            )

         }

         function Card({children, className, ...props}) {
            return (
                <div className=" flex flex-col items-center justify-center w-90 h-90 gap-3 bg-blue-300 rounded
                "
                {...props}
                >
                 <Text>CRIAR CONTA</Text>
                 {children}  
                </div>
            )
         }

         function RegisterForm() {
            const [nome, setNome] = React.useState('');
            const [email, setEmail] = React.useState('');
            const [senha, setSenha] = React.useState('');
            const [confirmarSenha, setconfirmarSenha] = React.useState('');
            const [cadastrado, setCadastrado] = React.useState(false);
            function handleSubmit(event){
                event.preventDefault()

                if (nome === '') {
                    alert("Digite o nome")
                    return
                }
                if (email === '') {
                    alert("Digite o email")
                    return
                }
                
                if (senha === '') {
                    alert("Digite uma senha")
                    return
                }
                
                if (confirmarSenha != senha || confirmarSenha === '' ) {
                    alert("Senha Incorreta")
                    return
                }
                setCadastrado(true)
    
            }
            

            if (cadastrado) {
                   return(
                    <Card> 
                    <Text> 
                    {`Seu cadastro foi feito com sucesso, 
                    bem-vindo ${nome},
                    Seu email cadastrado é: ${email}`}
                    </Text> 
                    <Button onClick={() => setCadastrado(false)}>VOLTAR</Button>  
                    </Card>
                   ) 
                    }
            return (
           
                <Card> 

                  <form onSubmit={handleSubmit} className="flex flex-col gap-3 items-center ">
                    <Input placeholder="Digite seu nome" value={nome} onChange={(e) => setNome(e.target.value)} />
                    <Input type="email" placeholder="Digite seu Email" value={email} onChange={(e) => setEmail(e.target.value)}/> 
                    <Input type="password" placeholder="Digite sua senha" value={senha} onChange={(e) => setSenha(e.target.value)}/>
                    <Input type="password" placeholder="Confirmar senha" value={confirmarSenha} 
                    onChange={(e) => setconfirmarSenha(e.target.value)}/>
                    <Button type="submit" className="px-2">Cadastrar</Button> 
                    <Text>Já tem uma conta? Entrar.</Text> 
                    </form>
                   
                </Card>   
                    
            )
         }

         function App() {
            return (
                <main className=" flex justify-center items-center p-30 gap-3"> 
                    <RegisterForm />
                </main>    
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />)

    </script>
    
</body>
</html>
